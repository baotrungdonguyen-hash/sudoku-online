package com.sudoku.controller;

import com.sudoku.entity.Leaderboard;
import com.sudoku.repository.LeaderboardRepository;
import org.springframework.web.bind.annotation.*;

import java.util.List;

@RestController
@RequestMapping("/api/leaderboard")
@CrossOrigin("*")
public class LeaderboardController {

    private final LeaderboardRepository repository;

    public LeaderboardController(
            LeaderboardRepository repository) {

        this.repository = repository;
    }

    @PostMapping
    public Leaderboard saveScore(
            @RequestBody Leaderboard leaderboard) {

        return repository.save(leaderboard);
    }

    @GetMapping("/{difficulty}")
    public List<Leaderboard> getLeaderboard(
            @PathVariable String difficulty) {

        return repository
                .findByDifficultyOrderByTimeSecondsAsc(difficulty);
    }
}